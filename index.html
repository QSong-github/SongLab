<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no"><meta name="theme-color" content="#142b42"><link rel="manifest" href="/SongLab/manifest.json"><link rel="shortcut icon" href="/SongLab/favicon.ico"><link rel="stylesheet" href="/SongLab/css/default.css"><link rel="stylesheet" href="/SongLab/css/layout.css"><link rel="stylesheet" href="/SongLab/css/media-queries.css"><link rel="stylesheet" href="/SongLab/css/magnific-popup.css"><title>Song Lab | Multimodal AI · Purdue University</title><link href="/SongLab/static/css/2.d3bc0dc5.chunk.css" rel="stylesheet"><link href="/SongLab/static/css/main.b6343e44.chunk.css" rel="stylesheet"><style id="songlab-academic-theme">:root{--navy:#142b42;--ink:#24384b;--muted:#596875;--gold:#b19a64;--paper:#f3f2ee;--line:#dedfdc}
html{scroll-padding-top:64px}body{background:var(--paper);color:var(--muted);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.7}
h1,h2,h3,h4{font-family:Arial,Helvetica,sans-serif;color:var(--navy);letter-spacing:0}a{color:#285c78}a:hover{color:#94783e}a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
/* Content must never depend on scroll-triggered reveal animations. */
.react-reveal{animation:none!important;opacity:1!important;visibility:visible!important;transform:none!important}
#nav-wrap,#nav-wrap.opaque{background:var(--navy)!important;border-bottom:1px solid #ffffff20;min-height:64px;display:block!important;opacity:1!important}
#nav-wrap ul#nav{min-height:64px}#nav-wrap ul#nav li a{color:#e7edf1!important;font:600 12px/64px Arial, sans-serif;letter-spacing:1.2px;padding:0 14px;height:64px}#nav-wrap ul#nav li.current a,#nav-wrap ul#nav li a:hover{color:#e2c98f!important}
#home{background:radial-gradient(ellipse at 82% 25%,#33536a 0,transparent 48%),linear-gradient(125deg,#102539,#1e3c53)!important;height:620px!important;min-height:540px!important;position:relative;overflow:hidden}
#home:after{content:"";position:absolute;right:-130px;top:40px;width:600px;height:600px;border:1px solid #c8ad7133;border-radius:50%;box-shadow:0 0 0 70px #ffffff03,0 0 0 140px #ffffff03;pointer-events:none}
#home .banner{max-width:1080px;width:86%;text-align:left;position:relative;z-index:1;padding-top:65px}#home .banner:before{content:"PURDUE UNIVERSITY  /  SONG LAB";display:block;color:#ddc68d;letter-spacing:3px;font-size:12px;font-weight:bold;margin-bottom:28px}
#home .banner h1{font:normal clamp(54px,7vw,84px)/1.08 Georgia,serif!important;color:#fff!important;text-shadow:none!important;letter-spacing:-2px;margin-bottom:24px}#home .banner h3{font:normal 24px/1.5 Arial,sans-serif!important;max-width:720px;margin:0;color:#d8e3ec!important;text-shadow:none!important}#home .banner h3 span{color:inherit!important}
#home .social{margin-top:32px;text-align:left}#home .social li{margin:0 12px 10px 0}#home .social a{background:#ffffff0c!important;border:1px solid #ffffff40!important;color:#fff!important;border-radius:4px!important;box-shadow:none!important;font-size:14px!important}#home .scrolldown a{color:#dcc58e!important}
#research,#news,#about,#teams,#publications,#software-tools,#contact{background:var(--paper)!important;padding:70px 0!important;border-bottom:1px solid var(--line);scroll-margin-top:0px}
.row{width:88%;max-width:1120px}section .header-col{float:none!important;width:100%!important;padding:0!important;margin:0 0 30px!important}section .header-col h1{font:normal 32px/1.25 Georgia,serif!important;text-transform:none!important;letter-spacing:-.4px!important;color:var(--navy)!important;margin:0!important}section .header-col h1 span{border:0!important;padding:0!important;display:inline-block}section .header-col h1:after{content:"";display:block;width:44px;height:3px;background:var(--gold);margin-top:16px}
section .main-col{float:none!important;width:100%!important;padding:0!important}section .columns{box-sizing:border-box}
#research .carousel-root{max-width:840px;margin:0 auto 36px;background:white;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 8px 28px #142b4208}
#research .carousel .slide{background:#fff}#research .carousel .slide .legend{background:var(--navy);opacity:.95;line-height:1.5;border-radius:6px}
#research .main-col>div:last-child{display:grid;grid-template-columns:1fr 1fr;gap:20px}#research .main-col>div:last-child>p{grid-column:1/-1;font-size:17px!important;line-height:1.8!important;padding:0!important;margin:0 0 8px!important;color:var(--muted)!important}
#research .main-col>div:last-child>div{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:26px!important;margin:0!important}#research h3{font-size:19px!important;line-height:1.45!important;color:var(--navy)!important}#research p{font-size:15px!important;line-height:1.75!important}#research p br+br{display:none}
#news .main-col>div,#publications .main-col>div{background:#fff;border:1px solid var(--line)!important;border-radius:7px;margin:0 0 12px!important;padding:20px 24px!important}#news p,#publications p{line-height:1.75!important;color:var(--ink)}#news p span{color:#856d36!important;font-size:14px!important}button,.button{background:var(--navy)!important;color:white!important;border-radius:5px!important;letter-spacing:.3px!important}
#about img[alt="Background"],#about div[style*="position: absolute"]{display:none}#about .row{background:#fff!important;padding:32px!important;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:30px}#about .three.columns{width:22%;padding:0}#about .nine.columns{width:78%!important}#about .profile-pic{width:100%!important;max-width:190px;border-radius:8px}#about h2{font:normal 30px Georgia,serif;color:var(--navy)}#about p{color:var(--muted);line-height:1.85;margin-bottom:0}
#teams .team-section-header h4{color:#856d36;font-size:15px;letter-spacing:1px;text-transform:uppercase;margin:4px 0 18px}#teams .team-section-header+div{display:grid;grid-template-columns:1fr 1fr;gap:16px}#teams .team-section-header+div>div{background:#fff;border:1px solid var(--line);padding:22px!important;margin:0!important}#teams h3{font-size:19px;color:var(--navy)!important}#teams p{font-size:14px;white-space:normal!important;line-height:1.6}#teams img{max-width:100px!important;height:125px!important}
#software-tools .main-col>div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}#software-tools .main-col>div>div{background:#fff!important;border:1px solid var(--line)!important;border-top:3px solid var(--gold)!important;border-radius:8px!important;padding:24px!important;margin:0!important;box-shadow:0 4px 14px #142b4205!important;display:flex!important;flex-direction:column;align-items:flex-start!important;cursor:default!important;gap:20px}#software-tools h4{font-size:20px;color:var(--navy)!important;line-height:1.4}#software-tools p{font-size:14px;line-height:1.65!important;color:var(--muted)!important}#software-tools a{background:var(--navy)!important;border-radius:4px!important;margin:0!important;font-size:13px!important;padding:8px 14px!important}#software-tools .main-col>br{display:none}
#contact{color:var(--muted)}#contact h1,#contact h1:before,#contact h4,#contact label,#contact p{color:var(--ink)}#contact .lead{font-size:19px;line-height:1.7}#contact input,#contact textarea,#contact select{background:#fff;color:var(--ink);border:1px solid #ccd3d7;border-radius:4px}#contact input:focus,#contact textarea:focus{background:#fff;border-color:var(--gold);outline:2px solid #b19a6430}#contact a{color:#285c78}
footer{background:var(--navy)!important;color:#bac9d4;padding:42px 0}footer a,footer a:visited{color:#d6e1e9}footer .social-links{margin-bottom:20px}#go-top a{background:#29465c}
@media(max-width:1100px){#software-tools .main-col>div{grid-template-columns:repeat(2,minmax(0,1fr))}#nav-wrap ul#nav li a{padding:0 10px;letter-spacing:1px}}
@media(max-width:767px){#nav-wrap{min-height:48px}#nav-wrap ul#nav{background:var(--navy);width:100%;padding:12px 0}#nav-wrap ul#nav li a{height:40px;line-height:40px}#nav-wrap>a.mobile-btn{background:var(--navy)}#home{height:560px!important;min-height:500px!important}#home .banner{width:86%;padding-top:36px}#home .banner h1{font-size:56px!important}#home .banner h3{font-size:20px!important}#home .banner:before{font-size:10px;letter-spacing:2px}#home:after{right:-400px}#home .social li{display:inline-block}#research,#news,#about,#teams,#publications,#software-tools,#contact{padding:48px 0!important}.row{width:88%;padding:0}section .header-col h1{font-size:28px!important}#research .main-col>div:last-child,#teams .team-section-header+div,#software-tools .main-col>div{grid-template-columns:1fr}#about .row{display:block;padding:24px!important}#about .three.columns,#about .nine.columns{width:100%!important}#about .profile-pic{max-width:140px;margin-bottom:22px}#contact input,#contact textarea{max-width:100%;box-sizing:border-box}#software-tools .main-col>div>div{padding:22px!important}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

#research{margin-bottom:0!important}#research .main-col>div:first-child{background:none!important}#research .main-col>div:last-child>div p{margin-bottom:0}
#contact a{overflow-wrap:anywhere}#contact .row{max-width:1120px}
@media(max-width:767px){#nav-wrap ul#nav{background:var(--navy)!important}#nav-wrap ul#nav li a{height:40px!important;line-height:40px!important;padding:0 20px!important}}
